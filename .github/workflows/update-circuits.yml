name: Update Circuit Data

# Keeps everything the 2D/3D track maps need in step with the calendar:
#   1. fetch-circuits      — official geometry from MultiViewer (replaces any
#                            GPS-baked file once MultiViewer has the venue)
#   2. bake-gps-circuits   — geometry for venues MultiViewer lacks, from the
#                            newest session's fastest clean lap (works from FP1)
#   3. fetch-georef        — 3D-map georeference, matched automatically against
#                            the latest bacinger/f1-circuits traces
#   4. fetch-pit-lanes     — pit-lane paths for circuits that don't have one
#
# Runs every Monday 06:00 UTC (the morning after a race weekend) and on demand.
# Changes are committed straight to main (data only, after type-check and
# tests), then the deploy workflow is dispatched: pushes made with the
# workflow token don't trigger other workflows on their own.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-circuits
  cancel-in-progress: false

env:
  DATA_PATHS: src/data/circuit-geometry/ src/data/circuit-georef.json src/data/pit-lanes.json

jobs:
  update-circuits:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch official circuit geometry (MultiViewer)
        run: node scripts/fetch-circuits.mjs

      - name: Bake missing circuits from OpenF1 GPS
        run: node scripts/bake-gps-circuits.mjs "$(date -u +%Y)"

      - name: Georeference circuits for the 3D map
        run: node scripts/fetch-georef.mjs --latest

      - name: Bake missing pit lanes
        run: node scripts/fetch-pit-lanes.mjs

      - name: Check for changes
        id: diff
        run: |
          git add -N $DATA_PATHS
          if git diff --quiet -- $DATA_PATHS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- $DATA_PATHS | tail -1
          fi

      # The data feeds tests (every geometry needs a georef; every surface must
      # be drawable), so a bad bake fails here instead of reaching main.
      - name: Type-check
        if: steps.diff.outputs.changed == 'true'
        run: yarn tsc -b

      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: yarn test

      - name: Commit and deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Skip the Husky pre-commit hook (lint + full test + build): checks
          # ran above, and its build rewrites public/sitemap.xml (lastmod =
          # today), leaving the tree dirty so `git pull --rebase` fails.
          HUSKY: "0"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add $DATA_PATHS
          ADDED=$(git diff --cached --name-only --diff-filter=A -- src/data/circuit-geometry/ | sed 's|.*/||;s|\.json||' | tr '\n' ' ')
          MODIFIED=$(git diff --cached --name-only --diff-filter=M -- src/data/circuit-geometry/ | sed 's|.*/||;s|\.json||' | tr '\n' ' ')

          {
            echo "- **New geometry**: ${ADDED:-none}"
            echo "- **Updated geometry**: ${MODIFIED:-none}"
            echo "- Georeference / pit lanes: see the diff"
          } > /tmp/changes.md

          git commit -m "chore(circuits): update baked circuit data" -m "$(cat /tmp/changes.md)"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main

          {
            echo "## 🏁 Circuit data updated"
            echo
            cat /tmp/changes.md
            echo
            echo "$(git show --stat --format= HEAD | tail -1). Type-check and tests passed; deploy dispatched."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: No changes summary
        if: steps.diff.outputs.changed == 'false'
        run: |
          echo "## 🏁 Circuit data check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ℹ️ No changes: geometry, georeferences and pit lanes are up to date." >> "$GITHUB_STEP_SUMMARY"
