name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate SEO routes
        run: yarn validate:seo

      - name: Type-check
        run: yarn tsc -b

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Resolve release version
        id: resolve-version
        run: echo "version=$(node scripts/resolve-release-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Create Sentry build env file
        run: |
          cat > .env.sentry-build-plugin <<'EOF'
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE=${{ steps.resolve-version.outputs.version }}
          EOF

      - name: Build
        env:
          VITE_APP_VERSION: ${{ steps.resolve-version.outputs.version }}
          VITE_OPENF1_API_BASE: ${{ secrets.VITE_OPENF1_API_BASE }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
