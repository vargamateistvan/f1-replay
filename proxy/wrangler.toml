name = "f1-replay-proxy"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

# KV namespace binding.
# After running `wrangler kv namespace create CACHE` replace the id below
# with the one printed by that command, and set preview_id for `wrangler dev`.
[[kv_namespaces]]
binding = "CACHE"
id = "ab5b437ce1b84e179ca6352bf30673b2"
preview_id = "e4b5f4d660ae47d0ba187ed5b2b25f74"

[vars]
PUSH_ENABLED = "true"
# Apply the D1 migrations and create both queues before deploying.
PUSH_PREFERENCES_ENABLED = "true"
PUSH_DISCOVERY_ENABLED = "true"
PUSH_DELIVERY_ENABLED = "true"
# Set OPENF1_API_KEY as a secret instead:
#   wrangler secret put OPENF1_API_KEY
# Leave this block here as documentation; secrets are not listed in wrangler.toml.

# Opt-in device notification setup (see README.md before enabling):
VAPID_PUBLIC_KEY = "BOEcWevztqQvI8lT_yBDn30i5-z0IQqTKsVzPP7kJyFl96Xymwkr6Vx8k4cjXvX4fqknJDYNE3IbnQO9Pj9EbiI"
VAPID_SUBJECT = "mailto:security@f1replay.app"
PUSH_ORIGINS = "https://f1replay.app"
# Store VAPID_PRIVATE_KEY with `wrangler secret put VAPID_PRIVATE_KEY`.

[[d1_databases]]
binding = "NOTIFICATIONS"
database_name = "f1-replay-notifications"
database_id = "15ce1018-320c-4f4a-ac19-e7e581c84285"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *", "0 4 * * *"] # Discovery/dispatch and daily retention cleanup.

[[queues.producers]]
binding = "PUSH_QUEUE"
queue = "f1-replay-push"

[[queues.consumers]]
queue = "f1-replay-push"
dead_letter_queue = "f1-replay-push-dead"
max_batch_size = 1
max_retries = 5
